<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaGuard — Reset Password</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="stylesheet" href="../styles/index.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="brand">
      <div class="brand-icon">💧</div>
      <h1>AquaGuard</h1>
      <p class="tagline">Set a new password</p>
    </div>

    <div id="status-banner" class="status-banner hidden"></div>

    <form id="reset-form" class="auth-form active hidden">
      <label for="reset-password">New Password</label>
      <div class="password-field">
        <input type="password" id="reset-password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
        <button type="button" class="toggle-pw" data-target="reset-password">show</button>
      </div>

      <label for="reset-confirm-password">Confirm New Password</label>
      <div class="password-field">
        <input type="password" id="reset-confirm-password" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password" />
        <button type="button" class="toggle-pw" data-target="reset-confirm-password">show</button>
      </div>

      <button type="submit" class="btn-primary">
        <span class="btn-label">Update Password</span>
        <span class="spinner hidden"></span>
      </button>
    </form>

    <p class="switch-line"><a href="index.html#signin">Back to Log In</a></p>

    <p class="footnote">Secured by Supabase. Your credentials never travel unsafe.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../javascript/reset-password.js"></script>
</body>
</html>
