<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaGuard — Dashboard</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="stylesheet" href="../styles/dashboard.css" />
</head>
<body class="dashboard-body app-body">

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon-sm">💧</span>
      <div>
        <strong>AquaGuard</strong>
        <small>Water Monitoring</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item active">📊 Dashboard</button>
    </nav>

    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">?</div>
      <div class="sidebar-user-text">
        <p id="user-name">—</p>
        <p id="user-role" class="muted">—</p>
      </div>
    </div>
    <button id="signout-btn" class="btn-ghost">Sign Out</button>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="shell-main">
    <header class="shell-topbar">
      <div>
        <h1 id="view-title">AquaGuard — Live Monitoring</h1>
        <p class="muted" id="view-subtitle">Pressure · Zone · Alerts</p>
      </div>
      <div class="topbar-actions">
        <span id="online-badge" class="badge online">● Live (simulated)</span>
      </div>
    </header>

    <main id="app-root" class="app-root">
      <!-- The dashboard renders here. No loading spinner. -->
    </main>
  </div>
</div>

<!-- ============================================================
     DASHBOARD TEMPLATE — matches the wireframe layout
     ============================================================ -->
<template id="dashboard-template">
  <div class="monitor-grid">

    <!-- ============ GAUGE PANEL (LEFT) ============ -->
    <section class="panel gauge-panel">
      <div class="panel-head">
        <div>
          <h2>PRESSURE MONITOR READING</h2>
          <p class="muted small-note" id="device-subtitle">Pipe #B-01 · Sensor S-01</p>
        </div>
        <span id="zone-chip" class="zone-chip warning">WARNING STAGE</span>
      </div>

      <div class="gauge-wrap">
        <canvas id="gauge-canvas" width="320" height="180"></canvas>
        <div class="gauge-readout">
          <span id="gauge-value">84.3</span>
          <span class="gauge-unit">PSI</span>
        </div>
      </div>

      <div class="led-strip" id="led-strip">
        <span class="led on amber"></span>
        <span class="led on amber"></span>
        <span class="led on amber"></span>
        <span class="led on amber"></span>
        <span class="led"></span>
      </div>

      <p class="muted small-note" id="last-updated">Updated just now</p>
    </section>

    <!-- ============ RIGHT COLUMN ============ -->
    <div class="monitor-right">

      <!-- KPI GRID -->
      <div class="kpi-grid">
        <div class="kpi">
          <p class="stat-label">Peak (Max)</p>
          <p class="kpi-value stat-red" id="kpi-peak">94.8 PSI</p>
        </div>
        <div class="kpi">
          <p class="stat-label">Baseline (Min)</p>
          <p class="kpi-value stat-green" id="kpi-baseline">12.1 PSI</p>
        </div>
        <div class="kpi">
          <p class="stat-label">Internal Temp</p>
          <p class="kpi-value" id="kpi-temp">74.2 °C</p>
        </div>
        <div class="kpi">
          <p class="stat-label">Flow Rate</p>
          <p class="kpi-value" id="kpi-flow">4.20 m³/h</p>
        </div>
      </div>

      <!-- IDE / FUNCTIONS PANEL -->
      <section class="panel code-panel">
        <div class="panel-head">
          <p class="panel-title">ESP32 Leakage Visual and Thresholds</p>
          <span class="muted small-note">leakage_monitor.ino</span>
        </div>
        <pre class="code-block"><code><span class="c">// ESP32 Leakage Monitoring Setup</span>
<span class="k">#include</span> <span class="s">&lt;WiFi.h&gt;</span>
<span class="k">#include</span> <span class="s">"ThingSpeak.h"</span>
<span class="k">const char*</span> ssid = <span class="s">"IoT_Net"</span>;
<span class="k">unsigned long</span> channelID = <span class="n">24819</span>;
<span class="k">int</span> THRESHOLD_RAW = <span class="n">600</span>;

<span class="k">void</span> <span class="f">setup</span>() {
  Serial.<span class="f">begin</span>(<span class="n">115200</span>);
  WiFi.<span class="f">begin</span>(ssid, pass);
  ThingSpeak.<span class="f">begin</span>(client);
}

<span class="k">void</span> <span class="f">loop</span>() {
  <span class="k">int</span> raw = <span class="f">analogRead</span>(<span class="n">34</span>);
  <span class="k">float</span> psi = <span class="f">convertToPSI</span>(raw);
  <span class="f">checkLeakage</span>(psi);
}</code></pre>

        <!-- FUNCTION / SIMULATED VALUES TABLE -->
        <table class="func-table">
          <thead>
            <tr>
              <th>Function Name</th>
              <th>Simulated Value</th>
              <th>Threshold</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>readPressureRaw()</td>
              <td>512</td>
              <td>600</td>
              <td><span class="pill ok">OK</span></td>
            </tr>
            <tr>
              <td>convertToPSI()</td>
              <td>7.5 PSI</td>
              <td>10.0 PSI</td>
              <td><span class="pill ok">OK</span></td>
            </tr>
            <tr>
              <td>checkLeakage()</td>
              <td>No Leak</td>
              <td>Leak Detected</td>
              <td><span class="pill safe">Safe</span></td>
            </tr>
          </tbody>
        </table>
      </section>

    </div>

    <!-- ============ BOTTOM ROW ============ -->
    <section class="panel">
      <div class="panel-head">
        <p class="panel-title">24H Pressure Analytics</p>
        <p class="muted small-note" id="trend-range"></p>
      </div>
      <div class="chart-box"><canvas id="trend-chart"></canvas></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <p class="panel-title">Hourly Average Pressure</p>
        <p class="muted small-note">Bars coloured by zone</p>
      </div>
      <div class="chart-box short"><canvas id="hourly-chart"></canvas></div>
    </section>

  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../javascript/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="../javascript/dashboard.js"></script>
</body>
</html>
