<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>AquaGuard — Loading…</title>
<link rel="stylesheet" href="../styles/dashboard.css" />
</head>
<body class="dashboard-body">
  <div class="center-msg" style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;">
    <span class="spinner-lg"></span>
    <p>Loading your dashboard…</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../javascript/config.js"></script>
  <script>
    (async function route() {
      const client = window.createAquaGuardClient();
      const { data: { user } } = await client.auth.getUser();
      if (!user) {
        window.location.href = "../logins/index.html";
        return;
      }

      const { data: profile } = await client
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      const role = String(profile?.role ?? "").trim().toLowerCase();

      if (role === "admin") {
        window.location.href = "admin.html";
      } else if (role === "wsp") {
        window.location.href = "dashboard-wsp.html";
      } else {
        window.location.href = "dashboard-home.html";
      }
    })();
  </script>
</body>
</html>
